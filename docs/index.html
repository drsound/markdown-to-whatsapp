<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to WhatsApp Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page">
        <header class="topbar">
            <div class="brand">
                <div class="brand-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                    </svg>
                </div>
                <div>
                    <div class="brand-name">Markdown → WhatsApp</div>
                    <div class="brand-sub">Private · runs entirely in your browser</div>
                </div>
            </div>
            <div class="topbar-right">
                <div class="seg theme-seg">
                    <button id="theme-light" type="button">Light</button>
                    <button id="theme-dark" type="button">Dark</button>
                </div>
                <a class="gh-link" href="https://github.com/drsound/markdown-to-whatsapp"
                    aria-label="View on GitHub" title="View on GitHub">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 16 16"
                        fill="currentColor" aria-hidden="true">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
                    </svg>
                </a>
            </div>
        </header>

        <main class="grid">
            <section class="card" id="editor-card">
                <div class="card-head">
                    <span class="card-title">Your Markdown</span>
                    <span class="hint-chip">paste · type · drop a .md file</span>
                </div>
                <textarea id="markdown-input" placeholder="Paste the text to convert here..." spellcheck="false"></textarea>
                <div class="drop-overlay" id="drop-overlay" hidden>Drop your .md file</div>
            </section>

            <section class="card">
                <div class="card-head">
                    <span class="card-title" id="preview-title">Preview</span>
                    <button type="button" class="opt-toggle head-opt" id="emoji-toggle" hidden
                        title="Prefix each heading with an emoji marking its level">📌 heading icons</button>
                </div>
                <div class="optbar" id="table-controls" hidden>
                    <span class="optbar-title">Tables</span>
                    <div class="optbar-group">
                        <span class="opt-label">Style</span>
                        <div class="seg fmt-seg">
                            <button type="button" data-fmt="ascii">ASCII</button>
                            <button type="button" data-fmt="always">List</button>
                            <button type="button" data-fmt="auto" class="active">Auto</button>
                        </div>
                        <div class="numfield" title="Use a table box if it fits in this many characters">
                            <span class="numfield-label" id="threshold-label">max</span>
                            <input type="number" id="tableThreshold" value="28" min="1" max="200"
                                aria-label="Maximum table width in characters">
                            <span class="numfield-unit" id="threshold-unit">ch</span>
                        </div>
                    </div>
                    <div class="optbar-group" id="border-controls" hidden>
                        <span class="opt-label">Border</span>
                        <div class="seg border-seg" id="border-seg" title="Table border characters">
                            <button type="button" data-border="unicode" class="active">Unicode</button>
                            <button type="button" data-border="ascii">Plain</button>
                        </div>
                    </div>
                    <div class="optbar-group" id="rows-controls" hidden>
                        <span class="opt-label">Separator</span>
                        <button type="button" class="check" id="rows-toggle" aria-pressed="false"
                            aria-label="Draw a rule between table rows"
                            title="Draw a rule between table rows"><span class="check-box"></span></button>
                    </div>
                </div>
                <div class="chat" id="chat">
                    <div class="chat-empty" id="chat-empty">
                        <div class="bubble-in">Your converted message will appear here, exactly as recipients will see it.</div>
                        <button id="load-example" type="button">Try an example</button>
                    </div>
                    <div class="chat-msg" id="chat-msg" hidden>
                        <div class="day-chip">TODAY</div>
                        <div class="bubble">
                            <div id="bubble-content"></div>
                            <div class="meta"><span id="msg-time"></span> <span class="ticks">✓✓</span></div>
                        </div>
                        <button id="raw-toggle" type="button">view raw syntax</button>
                    </div>
                </div>
                <div class="actions">
                    <button id="copy-button" type="button" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                        </svg>
                        <span id="copy-label">Copy for WhatsApp</span>
                    </button>
                    <a id="share-link" class="share" target="_blank" rel="noopener">Share on WhatsApp</a>
                </div>
            </section>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@18.0.10/lib/marked.umd.js"
        integrity="sha384-JD1I1oSYdjlw8850MjNFhpmRtgBZ97SjJYg9IJUE1RxR3DgG8oo4R43qLGMkd99t"
        crossorigin="anonymous"></script>
    <script src="converter.js"></script>
    <script src="ui.js" defer></script>
</body>

</html>
