name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write        # what lets npm authenticate this run over OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # trusted publishing needs a recent CLI; the one bundled with Node is older
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
